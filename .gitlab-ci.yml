# Tests on every push; on a tag like v0.3.0 (or a test tag v0.3.0-rc.1), cross-compiled binaries are
# uploaded to the package registry and attached to a GitLab release, and the same release is
# created on the GitHub mirror (job github-release).

stages: [test, build, release]

variables:
  GO_IMAGE: golang:1.26.1
  PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/barge/${CI_COMMIT_TAG}

test:
  stage: test
  image: $GO_IMAGE
  script:
    - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
    - go vet ./...
    - go test -race ./...

build:
  stage: build
  image: $GO_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
  script:
    # The tag must match the version written in cmd/barge/version.go.
    - |
      src=$(go run ./cmd/barge version --short)
      case "$CI_COMMIT_TAG" in
        "$src"|"$src"-rc.*) ;;
        *) echo "Tag $CI_COMMIT_TAG does not match releaseVersion $src in cmd/barge/version.go: bump it and CHANGELOG.md"; exit 1 ;;
      esac
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - mkdir -p dist
    - |
      for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
        os=${target%/*}; arch=${target#*/}
        name=barge_${CI_COMMIT_TAG}_${os}_${arch}
        ext=""; [ "$os" = windows ] && ext=".exe"
        mkdir -p "build/$name"
        CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
          -ldflags "-s -w -X main.version=${CI_COMMIT_TAG}" -o "build/$name/barge$ext" ./cmd/barge
        cp LICENSE README.md "build/$name/"
        if [ "$os" = windows ]; then (cd build && zip -qr "../dist/$name.zip" "$name");
        else tar -C build -czf "dist/$name.tar.gz" "$name"; fi
      done
    - (cd dist && sha256sum * > checksums.txt)
    - |
      for f in dist/*; do
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PACKAGE_URL}/$(basename "$f")"
      done
  artifacts:
    paths: [dist/]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
  script:
    - sh scripts/release-notes.sh "$CI_COMMIT_TAG" > release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: Barge CLI $CI_COMMIT_TAG
    description: ./release-notes.md
    assets:
      links:
        - name: Linux x86-64
          url: ${PACKAGE_URL}/barge_${CI_COMMIT_TAG}_linux_amd64.tar.gz
          link_type: package
        - name: Linux ARM64
          url: ${PACKAGE_URL}/barge_${CI_COMMIT_TAG}_linux_arm64.tar.gz
          link_type: package
        - name: macOS Intel
          url: ${PACKAGE_URL}/barge_${CI_COMMIT_TAG}_darwin_amd64.tar.gz
          link_type: package
        - name: macOS Apple Silicon
          url: ${PACKAGE_URL}/barge_${CI_COMMIT_TAG}_darwin_arm64.tar.gz
          link_type: package
        - name: Windows x86-64
          url: ${PACKAGE_URL}/barge_${CI_COMMIT_TAG}_windows_amd64.zip
          link_type: package
        - name: checksums.txt
          url: ${PACKAGE_URL}/checksums.txt
          link_type: other

# The same release on the GitHub mirror: notes and binaries. Runs when the
# GITHUB_TOKEN variable is set (Settings → CI/CD → Variables, masked and
# protected; tags v* must be protected for it to be available).
github-release:
  stage: release
  image: alpine:3.20
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/ && $GITHUB_TOKEN
  script:
    - apk add --no-cache curl jq >/dev/null
    - sh scripts/github-release.sh
